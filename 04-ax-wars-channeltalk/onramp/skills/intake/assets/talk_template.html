<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Onramp · 배포 인터뷰</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  /* ── Astryx식 토큰: 색/타이포/모양/모션을 CSS 변수로, light/dark 캐스케이드 ── */
  :root{
    --ch-primary:#6157EA; --ch-primary-strong:#4E40C9; --ch-primary-bright:#5E56F0;
    --ch-highlight:#3292E3; --ch-success:#20AB55;
    --ch-grad:linear-gradient(135deg,#6157EA,#8E57E7);
    --bg:#FFFFFF; --bg-grey:#F7F7F8; --bg-grey-2:#EFEFF0;
    --text:rgba(0,0,0,.85); --text-strong:#000; --text-2:rgba(0,0,0,.6); --text-3:rgba(0,0,0,.4);
    --on-primary:#FFFFFF; --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.15);
    --shadow-card:0 4px 24px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);
    --shadow-float:0 8px 30px -8px rgba(97,87,234,.45);
    --focus:0 0 0 3px rgba(97,87,234,.30);
    --radius-pill:999px; --radius-card:16px; --radius-sm:10px;
    --dur-fast:120ms; --dur-base:240ms; --dur-slow:600ms; --ease:cubic-bezier(.2,.8,.2,1);
    --font:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  }
  :root[data-theme="dark"], html[data-theme="dark"]{
    --bg:#0A0B0B; --bg-grey:#17171A; --bg-grey-2:#202024;
    --text:rgba(255,255,255,.9); --text-strong:#fff; --text-2:rgba(255,255,255,.62); --text-3:rgba(255,255,255,.42);
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A0B0B; --bg-grey:#17171A; --bg-grey-2:#202024;
      --text:rgba(255,255,255,.9); --text-strong:#fff; --text-2:rgba(255,255,255,.62); --text-3:rgba(255,255,255,.42);
      --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font); color:var(--text); background:var(--bg);
    -webkit-font-smoothing:antialiased; overflow-x:hidden; position:relative;}
  body::before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(56% 48% at 88% 12%, rgba(97,87,234,.10), transparent 70%),
      radial-gradient(46% 42% at 96% 94%, rgba(50,146,227,.08), transparent 70%);}

  .shell{position:relative; z-index:1; min-height:100%; display:flex; flex-direction:column;
    max-width:1260px; margin:0 auto; padding:26px clamp(20px,4vw,56px) 22px;}

  header{display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .logo{height:30px; width:auto; display:block;}
  .brand .tag{font-size:12px; font-weight:600; letter-spacing:.02em; color:var(--text-3);
    padding:4px 10px; border:1px solid var(--line); border-radius:var(--radius-pill);}

  main{flex:1; display:grid; grid-template-columns:0.94fr 1.06fr; gap:clamp(26px,4.5vw,64px);
    align-items:center; padding:clamp(16px,3.5vh,46px) 0;
    transition:grid-template-columns var(--dur-slow) var(--ease), gap var(--dur-slow);}
  main.started{grid-template-columns:0.56fr 1.44fr; gap:clamp(24px,4vw,56px);}

  .eyebrow{font-size:12.5px; font-weight:700; letter-spacing:.22em; text-transform:uppercase;
    color:var(--ch-primary); display:flex; align-items:center; gap:10px;}
  .eyebrow::before{content:""; width:24px; height:3px; border-radius:3px; background:var(--ch-grad);}
  h1{font-weight:800; font-size:clamp(38px,5.4vw,68px); line-height:1.06;
    letter-spacing:-.02em; margin:20px 0 0; color:var(--text-strong);}
  h1 .accent{color:var(--ch-primary);}
  .sub{font-size:clamp(15px,1.5vw,18px); line-height:1.62; color:var(--text-2); margin-top:20px; max-width:42ch; word-break:keep-all;}
  .konote{font-size:12.5px; font-weight:500; color:var(--text-2); margin-top:14px; display:inline-flex; align-items:center; gap:8px;}
  .konote::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--ch-highlight);}

  .controls{margin-top:30px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .cta{font-weight:700; font-size:15px; letter-spacing:.01em;
    background:var(--ch-primary); color:var(--on-primary); border:0; border-radius:var(--radius-pill);
    padding:15px 30px; cursor:pointer;
    transition:transform var(--dur-base) var(--ease), box-shadow var(--dur-base), background var(--dur-fast);
    box-shadow:var(--shadow-float);}
  .cta:hover{transform:translateY(-2px); background:var(--ch-primary-strong);}
  .cta:focus-visible{outline:0; box-shadow:var(--focus), var(--shadow-float);}
  .cta:disabled{opacity:.45; cursor:default; transform:none; box-shadow:none;}
  .cta.end{background:transparent; color:var(--ch-primary); box-shadow:none; border:1.5px solid var(--ch-primary);}
  .status{font-size:13.5px; font-weight:500; color:var(--text-2); display:flex; align-items:center; gap:9px;}
  .sdot{width:9px;height:9px;border-radius:50%;background:var(--text-3);transition:var(--dur-base);}
  .status.live .sdot{background:var(--ch-success); animation:ring 1.5s infinite;}
  .status.speak .sdot{background:var(--ch-primary);}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(32,171,85,.5)}70%{box-shadow:0 0 0 11px rgba(32,171,85,0)}100%{box-shadow:0 0 0 0 rgba(32,171,85,0)}}
  .hint{font-size:12.5px; color:var(--text-3); margin-top:18px;}
  .hint kbd{font-weight:600; background:var(--bg-grey); border:1px solid var(--line-2);
    border-radius:6px; padding:1px 7px; font-size:11.5px; color:var(--text);}

  /* 오른쪽: 음성 오브 + transcript */
  .stage{display:flex; flex-direction:column; align-items:center; gap:24px;}
  .orbring{position:relative; width:clamp(168px,18vw,208px); aspect-ratio:1;
    transition:width var(--dur-slow) var(--ease);}
  main.started .orbring{width:clamp(116px,11vw,144px);}
  .orb{position:absolute; inset:0; border-radius:var(--radius-pill);
    background:var(--ch-grad);
    box-shadow:0 24px 70px -22px rgba(97,87,234,.7), inset 0 0 60px rgba(255,255,255,.22);
    animation:breathe 6s ease-in-out infinite;}
  .orb::after{content:""; position:absolute; inset:0; border-radius:var(--radius-pill);
    background:conic-gradient(from 0deg, transparent, rgba(255,255,255,.30), transparent 40%);
    animation:spin 9s linear infinite; mix-blend-mode:screen;}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .orbring.speaking .orb{animation:breathe 1.2s ease-in-out infinite; filter:saturate(1.2) brightness(1.06);}
  .orbring.idle .orb{filter:saturate(.9) brightness(1.0);}

  .panel{width:100%; max-width:680px; background:var(--bg); border:1px solid var(--line);
    border-radius:var(--radius-card); padding:16px 18px 8px; min-height:170px;
    max-height:36vh; overflow:auto; box-shadow:var(--shadow-card);
    transition:max-height var(--dur-slow) var(--ease), max-width var(--dur-slow);}
  main.started .panel{max-height:58vh; max-width:880px;}
  .panel-h{font-size:11.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    color:var(--text-3); padding-bottom:12px; margin-bottom:4px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;}
  .panel-h .live-tag{color:var(--ch-success);}

  .turn{display:flex; gap:10px; align-items:flex-start; margin:14px 2px; opacity:0; transform:translateY(6px); animation:rise var(--dur-base) forwards;}
  .turn.you{flex-direction:row-reverse;}
  @keyframes rise{to{opacity:1; transform:none}}
  .ava{flex:0 0 auto; width:28px; height:28px; border-radius:50%; margin-top:2px;}
  .ava.ai{background:var(--ch-grad); box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);}
  .ava.you{background:var(--bg-grey-2); border:1px solid var(--line);}
  .bubble{max-width:92%;}
  main.started .bubble{max-width:95%;}
  .turn.you .bubble{text-align:right;}
  .nm{font-size:10.5px; font-weight:600; letter-spacing:.08em; margin-bottom:4px;}
  .turn.ai .nm{color:var(--ch-primary);} .turn.you .nm{color:var(--text-3);}
  .msg{font-size:15px; line-height:1.6; word-break:keep-all; border-radius:var(--radius-sm);
    padding:10px 14px; display:inline-block; text-align:left;}
  .turn.ai .msg{background:var(--bg-grey); color:var(--text); border-bottom-left-radius:4px;}
  .turn.you .msg{background:var(--ch-primary); color:var(--on-primary); border-bottom-right-radius:4px;}
  .empty{color:var(--text-3); font-size:13.5px; padding:12px 2px;}

  footer{display:flex; justify-content:space-between; align-items:center; gap:12px; padding-top:16px;
    border-top:1px solid var(--line); font-size:12px; font-weight:500; color:var(--text-3);}
  .feat{display:flex; gap:16px; flex-wrap:wrap;}
  .feat span{display:inline-flex; align-items:center; gap:6px;}
  .feat span::before{content:""; width:6px;height:6px;border-radius:50%;background:var(--ch-primary);}
  .page-pill{border:1px solid var(--line); border-radius:var(--radius-pill); padding:3px 12px;}

  .rise-in{opacity:0; transform:translateY(14px); animation:enter .7s var(--ease) forwards;}
  @keyframes enter{to{opacity:1; transform:none}}
  .d1{animation-delay:.05s}.d2{animation-delay:.16s}.d3{animation-delay:.28s}.d4{animation-delay:.4s}.d5{animation-delay:.52s}.d6{animation-delay:.64s}

  @media (max-width:880px){ main{grid-template-columns:1fr; gap:30px;} main.started{grid-template-columns:1fr;} .stage{order:2} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
  <div class="shell">
    <header class="rise-in d1">
      <div class="brand">
        <img class="logo" src="channel-logo.webp" alt="채널톡" />
        <span class="tag">Onramp</span>
      </div>
    </header>

    <main id="main">
      <section class="hero">
        <div class="eyebrow rise-in d2">배포 인터뷰 · INTAKE</div>
        <h1 class="rise-in d3">말로 캐내는<br><span class="accent">배포 준비.</span></h1>
        <p class="sub rise-in d4">고객 현업과 자연스럽게 대화하면서, 알프를 어떻게 깔지에 필요한 것들을 끌어냅니다. 타이핑이 아니라 대화로.</p>
        <div class="konote rise-in d4">인터뷰는 한국어로 진행됩니다.</div>
        <div class="controls rise-in d5">
          <button class="cta" id="start">인터뷰 시작</button>
          <div class="status" id="status"><span class="sdot"></span><span id="statusText">준비되면 시작하세요.</span></div>
        </div>
        <p class="hint rise-in d6">답을 마치면 <kbd>Enter</kbd> 또는 <kbd>Space</kbd> 를 눌러 턴을 넘기세요.</p>
      </section>

      <section class="stage rise-in d4">
        <div class="orbring idle" id="orb"><div class="orb"></div></div>
        <div class="panel">
          <div class="panel-h"><span>실시간 기록</span><span class="live-tag" id="liveTag"></span></div>
          <div id="log"><div class="empty" id="empty">대화가 여기에 표시됩니다.</div></div>
        </div>
      </section>
    </main>

    <footer class="rise-in d6">
      <div class="feat">
        <span>열린 환경</span><span>에코 제거</span><span>끼어들기 가능</span>
      </div>
      <div class="page-pill">ElevenLabs · Claude</div>
    </footer>
  </div>

<script type="module">
import { Conversation } from "https://esm.sh/@elevenlabs/client@1.14.0";
const SIGNED_URL = "__SIGNED_URL__";
const $ = (id) => document.getElementById(id);
let conv=null, connected=false, muted=false;

const ST = {
  ready:"준비되면 시작하세요.", connecting:"연결 중…",
  listening:"듣고 있어요 — 말씀하세요.", speaking:"인터뷰어가 말하는 중…",
  finishing:"확인했어요 — 턴을 넘겼습니다.", ended:"인터뷰가 끝났습니다.",
};
function setStatus(key, extra){
  $("statusText").textContent = (ST[key]||key) + (extra||"");
  const s=$("status"); s.classList.remove("live","speak");
  if(key==="listening"||key==="finishing") s.classList.add("live");
  if(key==="speaking") s.classList.add("speak");
}
function orbState(s){ $("orb").className = "orbring " + s; }

function addTurn(who, text){
  if(!text) return;
  const e=$("empty"); if(e) e.remove();
  const row=document.createElement("div");
  row.className="turn "+(who==="ai"?"ai":"you");
  const ava=document.createElement("span"); ava.className="ava "+(who==="ai"?"ai":"you");
  const bub=document.createElement("div"); bub.className="bubble";
  const nm=document.createElement("div"); nm.className="nm"; nm.textContent=who==="ai"?"인터뷰어":"나";
  const msg=document.createElement("div"); msg.className="msg"; msg.textContent=text;
  bub.appendChild(nm); bub.appendChild(msg);
  row.appendChild(ava); row.appendChild(bub);
  $("log").appendChild(row);
  const p=$("log").parentElement; p.scrollTop=p.scrollHeight;
}

function finishTurn(){
  if(!connected||!conv||muted) return;
  if(typeof conv.setMicMuted==="function"){
    conv.setMicMuted(true); muted=true; setStatus("finishing");
    setTimeout(()=>{ if(muted&&conv){ try{conv.setMicMuted(false);}catch(e){} muted=false; } }, 6000);
  }
}
function unmute(){ if(muted&&conv){ try{conv.setMicMuted(false);}catch(e){} muted=false; } }
document.addEventListener("keydown",(e)=>{
  if((e.key==="Enter"||e.key===" ")&&connected){
    if(document.activeElement&&document.activeElement.tagName==="BUTTON"&&e.key===" ") return;
    e.preventDefault(); finishTurn();
  }
});

$("start").addEventListener("click", async ()=>{
  if(connected){ try{ await conv?.endSession?.(); }catch(e){} return; }
  $("start").disabled=true; setStatus("connecting"); orbState("listening");
  try{
    conv=await Conversation.startSession({
      signedUrl:SIGNED_URL,
      onConnect:()=>{ connected=true; $("start").disabled=false; $("start").textContent="인터뷰 종료";
        $("start").classList.add("end"); $("liveTag").textContent="● live"; $("main").classList.add("started");
        setStatus("listening"); orbState("listening"); },
      onDisconnect:()=>{ connected=false; muted=false; $("start").textContent="인터뷰 시작";
        $("start").classList.remove("end"); $("liveTag").textContent=""; $("main").classList.remove("started");
        setStatus("ended"); orbState("idle"); },
      onError:(m)=>{ setStatus("오류: ",(m&&m.message)?m.message:String(m)); $("start").disabled=false; },
      onModeChange:(m)=>{ if(m.mode==="speaking"){ setStatus("speaking"); orbState("speaking"); }
        else { unmute(); setStatus("listening"); orbState("listening"); } },
      onMessage:(p)=>{ if(p&&p.message) addTurn(p.source==="ai"?"ai":"you", p.message); },
    });
  }catch(e){ setStatus("오류: ",(e&&e.message)?e.message:String(e)); $("start").disabled=false; orbState("idle"); }
});
orbState("idle");
</script>
</body>
</html>
