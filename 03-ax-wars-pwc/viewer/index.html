<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAAP/IFRS 정적 인용 뷰어</title>
<style>
body { font-family: sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #222; }
h1 { font-size: 1.3rem; }
textarea { width: 100%; height: 12rem; box-sizing: border-box; font-family: monospace; font-size: 0.85rem; }
button { margin: 0.5rem 0 1rem; padding: 0.4rem 1rem; font-size: 0.95rem; cursor: pointer; }
#mode { font-size: 0.85rem; color: #555; margin-bottom: 0.5rem; }
#error { color: #b00020; white-space: pre-wrap; }
ol#hits { padding-left: 1.5rem; }
ol#hits li { margin-bottom: 1rem; }
.text { white-space: pre-wrap; margin: 0 0 0.25rem; }
.src { font-size: 0.8rem; word-break: break-all; }
</style>
</head>
<body>
<h1>GAAP/IFRS 정적 인용 뷰어</h1>
<p><code>entry.answer_query</code> 결과 JSON을 붙여넣고 렌더를 누르면 원문(<code>hits[].text</code>)과 출처(<code>source_url</code>)를 목록으로 보여준다.</p>
<textarea id="input" placeholder='{"mode": "full", "hits": [{"text": "...", "source_url": "..."}]}'></textarea>
<br>
<button id="render" type="button">렌더</button>
<div id="mode"></div>
<div id="error"></div>
<ol id="hits"></ol>
<script>
document.getElementById("render").addEventListener("click", function () {
  var modeEl = document.getElementById("mode");
  var errEl = document.getElementById("error");
  var list = document.getElementById("hits");
  modeEl.textContent = "";
  errEl.textContent = "";
  list.textContent = "";
  var data;
  try {
    data = JSON.parse(document.getElementById("input").value);
  } catch (e) {
    errEl.textContent = "JSON 파싱 실패: " + e.message;
    return;
  }
  if (data && data.mode) {
    modeEl.textContent = "mode: " + data.mode;
  }
  var hits = (data && data.hits) || [];
  if (!hits.length) {
    errEl.textContent = "hits가 비어 있다.";
    return;
  }
  hits.forEach(function (hit) {
    var li = document.createElement("li");
    var text = document.createElement("p");
    text.className = "text";
    text.textContent = hit.text || "";
    li.appendChild(text);
    var src = document.createElement("div");
    src.className = "src";
    if (hit.source_url) {
      var a = document.createElement("a");
      a.href = hit.source_url;
      a.textContent = hit.source_url;
      src.appendChild(a);
    } else {
      src.textContent = "(source_url 없음)";
    }
    li.appendChild(src);
    list.appendChild(li);
  });
});
</script>
</body>
</html>
